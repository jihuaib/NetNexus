<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>NetNexus - 启动中</title>
        <style>
            :root {
                --nn-font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans',
                    sans-serif;
                --nn-color-primary: #075cbd;
                --nn-color-success: #237a45;
                --nn-color-warning: #9a6100;
                --nn-color-error: #c9362b;
                --nn-color-bg-body: #f4f6f8;
                --nn-color-bg-progress: #d9e0e6;
                --nn-color-text: #17212b;
                --nn-color-text-strong: #111820;
                --nn-color-text-secondary: #4a5a6a;
                --nn-color-text-muted: #667789;
                --nn-color-border: #8795a3;
                --nn-color-border-light: #d7dde3;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: var(--nn-font-family);
                background: var(--nn-color-bg-body);
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                overflow: hidden;
                color: var(--nn-color-text);
            }

            .splash-container {
                display: flex;
                flex-direction: column;
                height: 100%;
                padding: 38px 46px 36px;
                width: 100%;
                border-top: 4px solid var(--nn-color-primary);
                background: var(--nn-color-bg-body);
            }

            .logo-container {
                display: grid;
                grid-template-columns: 58px minmax(0, 1fr);
                grid-template-rows: auto auto;
                column-gap: 18px;
                align-items: center;
                padding-bottom: 24px;
                border-bottom: 1px solid var(--nn-color-border-light);
            }

            .logo {
                grid-row: 1 / span 2;
                width: 58px;
                height: 58px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .logo img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            .app-name {
                align-self: end;
                margin-bottom: 3px;
                color: var(--nn-color-text-strong);
                font-size: 26px;
                font-weight: 650;
                line-height: 1.2;
                letter-spacing: 0.2px;
            }

            .app-subtitle {
                align-self: start;
                color: var(--nn-color-text-secondary);
                font-size: 13px;
                line-height: 1.5;
            }

            .loading-container {
                display: flex;
                flex: 1;
                flex-direction: column;
                min-height: 0;
                padding-top: 28px;
            }

            .progress-bar-container {
                width: 100%;
                height: 3px;
                background: var(--nn-color-bg-progress);
                overflow: hidden;
                margin-bottom: 12px;
            }

            .progress-bar {
                height: 100%;
                background: var(--nn-color-primary);
                width: 0%;
                transition: width 0.3s ease-out;
            }

            .loading-text {
                min-width: 0;
                overflow: hidden;
                color: var(--nn-color-text);
                font-size: 13px;
                font-weight: 600;
                text-align: left;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .loading-percentage {
                color: var(--nn-color-primary);
                font-size: 12px;
                font-weight: 600;
                font-variant-numeric: tabular-nums;
            }

            .loading-summary {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
            }

            .startup-steps {
                flex: 1;
                min-height: 0;
                margin-top: 22px;
                padding: 0;
                overflow: hidden;
                border-top: 1px solid var(--nn-color-border-light);
                background: var(--nn-color-bg-body);
                text-align: left;
            }

            .startup-steps-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                min-height: 40px;
                margin-bottom: 2px;
                color: var(--nn-color-text-secondary);
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.2px;
            }

            .startup-step-list {
                display: flex;
                flex-direction: column;
                list-style: none;
            }

            .startup-step {
                display: grid;
                min-width: 0;
                align-items: center;
                grid-template-columns: 17px minmax(0, 1fr) auto;
                gap: 10px;
                min-height: 28px;
                color: var(--nn-color-text-muted);
                font-size: 12px;
                line-height: 17px;
            }

            .startup-step-current {
                color: var(--nn-color-text);
            }

            .startup-step-warning {
                color: var(--nn-color-warning);
            }

            .startup-step-error {
                color: var(--nn-color-error);
            }

            .startup-step-status {
                width: 14px;
                height: 14px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: 1px solid var(--nn-color-border);
                border-radius: 50%;
                color: var(--nn-color-text-muted);
                font-size: 9px;
                font-weight: 700;
            }

            .startup-step-current .startup-step-status {
                border-color: var(--nn-color-primary);
                border-right-color: transparent;
                animation: statusSpin 0.8s linear infinite;
            }

            .startup-step-done .startup-step-status {
                border-color: var(--nn-color-success);
                color: var(--nn-color-success);
            }

            .startup-step-warning .startup-step-status {
                border-color: var(--nn-color-warning);
                color: var(--nn-color-warning);
            }

            .startup-step-error .startup-step-status {
                border-color: var(--nn-color-error);
                color: var(--nn-color-error);
            }

            .startup-step-text {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .startup-step-progress {
                color: var(--nn-color-text-muted);
                font-size: 10px;
                font-variant-numeric: tabular-nums;
            }

            @keyframes statusSpin {
                to {
                    transform: rotate(360deg);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .startup-step-current .startup-step-status {
                    animation: none;
                }
            }
        </style>
    </head>

    <body>
        <div class="splash-container">
            <div class="logo-container">
                <div class="logo">
                    <img src="./assets/logo.png" alt="NetNexus Logo" />
                </div>
                <h1 class="app-name">NetNexus</h1>
                <p class="app-subtitle">网络和开发辅助工具集</p>
            </div>

            <div class="loading-container">
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="loading-summary">
                    <div class="loading-text" id="loadingText">启动界面已显示</div>
                    <div class="loading-percentage" id="loadingPercentage">0%</div>
                </div>
                <section class="startup-steps" aria-label="启动检查进度">
                    <div class="startup-steps-header">
                        <span>启动检查</span>
                        <span id="stepsSummary">0 项完成</span>
                    </div>
                    <ol class="startup-step-list" id="startupStepList" aria-live="polite"></ol>
                </section>
            </div>
        </div>

        <script>
            const startupSteps = [];
            const visibleStepCount = 5;

            function normalizeStepState(state, progress, text) {
                if (state === 'error' || /失败|错误/.test(text)) return 'error';
                if (state === 'warning' || /超时/.test(text)) return 'warning';
                if (state === 'done' || progress >= 100) return 'done';
                return 'active';
            }

            function resolveStepKey(text) {
                const stageMatchers = [
                    [/启动界面/, 'splash'],
                    [/核心组件/, 'core'],
                    [/系统托盘|初始化托盘/, 'tray'],
                    [/主窗口创建|创建主窗口/, 'main-window'],
                    [/主进程服务/, 'main-services'],
                    [/版本兼容性/, 'compatibility'],
                    [/基础设置/, 'base-settings'],
                    [/工具设置/, 'tools-settings'],
                    [/更新设置/, 'update-settings'],
                    [/外部接入|HTTP API|Telnet CLI/, 'external-access'],
                    [/设置加载完成/, 'settings-complete'],
                    [/主窗口资源/, 'window-resources'],
                    [/页面渲染|页面就绪|等待页面渲染/, 'renderer'],
                    [/启动完成/, 'complete'],
                    [/启动失败/, 'startup-error']
                ];
                return stageMatchers.find(([pattern]) => pattern.test(text))?.[1] || `step-${startupSteps.length}`;
            }

            function renderStartupSteps() {
                const stepList = document.getElementById('startupStepList');
                const stepsSummary = document.getElementById('stepsSummary');
                if (!stepList || !stepsSummary) return;

                stepList.replaceChildren();
                const completedCount = startupSteps.filter(step => step.state === 'done').length;
                stepsSummary.textContent = `${completedCount}/${startupSteps.length} 项完成`;

                startupSteps.slice(-visibleStepCount).forEach(step => {
                    const item = document.createElement('li');
                    item.className = `startup-step startup-step-${step.state === 'active' ? 'current' : step.state}`;

                    const status = document.createElement('span');
                    status.className = 'startup-step-status';
                    status.setAttribute('aria-hidden', 'true');
                    if (step.state === 'done') status.textContent = '✓';
                    if (step.state === 'warning') status.textContent = '!';
                    if (step.state === 'error') status.textContent = '×';

                    const label = document.createElement('span');
                    label.className = 'startup-step-text';
                    label.textContent = step.text;

                    const percentage = document.createElement('span');
                    percentage.className = 'startup-step-progress';
                    percentage.textContent = `${Math.round(step.progress)}%`;

                    item.append(status, label, percentage);
                    stepList.append(item);
                });
            }

            function updateStartupSteps(progress, text, state) {
                if (!text) return;
                const normalizedState = normalizeStepState(state, progress, text);
                const stepKey = resolveStepKey(text);
                const previousStep = startupSteps[startupSteps.length - 1];

                if (previousStep?.key === stepKey) {
                    previousStep.text = text;
                    previousStep.progress = progress;
                    previousStep.state = normalizedState;
                    renderStartupSteps();
                    return;
                }

                if (previousStep?.state === 'active') {
                    previousStep.state = 'done';
                }
                startupSteps.push({ key: stepKey, text, progress, state: normalizedState });
                renderStartupSteps();
            }

            // 更新加载进度
            window.updateProgress = function (progress, text, state = 'active') {
                const progressBar = document.getElementById('progressBar');
                const loadingText = document.getElementById('loadingText');
                const loadingPercentage = document.getElementById('loadingPercentage');
                const normalizedProgress = Math.min(100, Math.max(0, Number(progress) || 0));

                if (progressBar) {
                    progressBar.style.width = normalizedProgress + '%';
                }
                if (loadingText && text) {
                    loadingText.textContent = text;
                }
                if (loadingPercentage) {
                    loadingPercentage.textContent = Math.round(normalizedProgress) + '%';
                }
                updateStartupSteps(normalizedProgress, text, state);
            };

            // 初始进度
            updateProgress(0, '启动界面已显示');
            window.startupProgress?.onUpdate?.(({ progress, text, state }) => {
                updateProgress(progress, text, state);
            });
        </script>
    </body>
</html>
