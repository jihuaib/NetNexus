name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag, for example v4.0.9'
                required: true
                type: string

permissions:
    contents: write

env:
    CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    NODE_VERSION: '16.20.2'

jobs:
    build-windows:
        name: Build Windows
        runs-on: windows-2022
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Verify Node.js version
              run: node -e "if (process.version !== 'v' + process.env.NODE_VERSION) { throw new Error('Expected Node.js v' + process.env.NODE_VERSION + ', got ' + process.version); }"

            - name: Setup Python for native modules
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: npm ci

            - name: Run Windows lint
              run: npm run lint

            - name: Build bundled libyang runtime
              run: npm run libyang:build:windows

            - name: Test bundled libyang runtime
              run: npm run libyang:smoke

            - name: Run Windows tests
              run: npm test

            - name: Run Windows minified CI tests
              run: npm run test:ci:minified

            - name: Build on Windows
              run: npm run build

            - name: Build Windows installer
              run: npm run dist -- --publish never

            - name: Verify packaged BMP SQLite
              run: npm run test:packaged:sqlite
              env:
                  PACKAGED_SQLITE_EXPECTED_ARCH: x64

            - name: Upload Windows artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows
                  path: |
                      release/*.exe
                      release/latest.yml
                      release/*.blockmap
                  if-no-files-found: error
                  retention-days: 7

    build-macos:
        name: Build macOS arm64
        runs-on: macos-15
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Verify Node.js version
              run: node -e "if (process.version !== 'v' + process.env.NODE_VERSION) { throw new Error('Expected Node.js v' + process.env.NODE_VERSION + ', got ' + process.version); }"

            - name: Setup Python for native modules
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: npm ci

            - name: Run macOS lint
              run: npm run lint

            - name: Install libyang build dependencies
              run: brew install cmake

            - name: Build bundled libyang runtime
              run: npm run libyang:build:unix

            - name: Test bundled libyang runtime
              run: npm run libyang:smoke

            - name: Run macOS tests
              run: npm test

            - name: Run macOS minified CI tests
              run: npm run test:ci:minified

            - name: Build on macOS
              run: npm run build

            - name: Build macOS packages
              run: npm run dist:mac:arm64 -- --publish never

            - name: Verify packaged BMP SQLite
              run: npm run test:packaged:sqlite
              env:
                  PACKAGED_SQLITE_EXPECTED_ARCH: arm64

            - name: Upload macOS artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: macos-arm64
                  path: |
                      release/*.dmg
                      release/*.zip
                      release/*.blockmap
                  if-no-files-found: error
                  retention-days: 7

    publish:
        name: Publish GitHub Release
        needs:
            - build-windows
            - build-macos
        runs-on: macos-latest
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
            RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag || github.ref }}

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-assets
                  merge-multiple: true

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Generate combined macOS update manifest
              run: node scripts/generate-mac-update-manifest.js release-assets

            - name: List release assets
              run: ls -lah release-assets

            - name: Verify release token
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                    echo "RELEASE_TOKEN secret is not configured"
                    exit 1
                  fi

            - name: Create or update release
              run: |
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    gh release upload "$RELEASE_TAG" release-assets/* --clobber
                  else
                    gh release create "$RELEASE_TAG" release-assets/* \
                      --title "NetNexus $RELEASE_TAG" \
                      --notes "自动发布 $RELEASE_TAG" \
                      --target "$GITHUB_SHA"
                  fi
