name: Test

on:
    pull_request:
    push:
        branches:
            - main
            - master

jobs:
    e2e-macos:
        name: macOS Tests and Packaged E2E
        runs-on: macos-latest
        env:
            NODE_VERSION: '16.20.2'

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Verify Node.js version
              run: node -e "if (process.version !== 'v' + process.env.NODE_VERSION) { throw new Error('Expected Node.js v' + process.env.NODE_VERSION + ', got ' + process.version); }"

            - name: Install dependencies
              run: npm ci

            - name: Run macOS lint
              run: npm run lint

            - name: Run macOS tests
              run: npm test

            - name: Run macOS minified CI tests
              run: npm run test:ci:minified

            - name: Build on macOS
              run: npm run build

            - name: Run macOS packaged UI tests
              run: npm run test:e2e

            - name: Upload Playwright report
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-macos
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    e2e-windows:
        name: Windows Tests and Packaged E2E
        runs-on: windows-latest
        env:
            NODE_VERSION: '16.20.2'

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Verify Node.js version
              run: node -e "if (process.version !== 'v' + process.env.NODE_VERSION) { throw new Error('Expected Node.js v' + process.env.NODE_VERSION + ', got ' + process.version); }"

            - name: Install dependencies
              run: npm ci

            - name: Run Windows lint
              run: npm run lint

            - name: Run Windows tests
              run: npm test

            - name: Run Windows minified CI tests
              run: npm run test:ci:minified

            - name: Build on Windows
              run: npm run build

            - name: Run Windows packaged UI tests
              run: npm run test:e2e

            - name: Upload Playwright report
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-windows
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7
