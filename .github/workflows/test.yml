name: Test

on:
    pull_request:
    push:
        branches:
            - main
            - master

jobs:
    frr-bmp-e2e:
        name: FRR BMP Interoperability E2E
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            NODE_VERSION: '16.20.2'
            FRR_BMP_ROUTES_PER_FAMILY: '1024'

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Setup Python for native modules
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: npm ci

            - name: Verify Docker
              run: docker info

            - name: Run FRR BMP interoperability E2E
              run: npm run test:e2e:frr

    e2e-macos:
        name: macOS ${{ matrix.arch }} Tests and Packaged E2E
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: arm64
                      runner: macos-15
                      bmpAssuranceFirstBuildBudgetMs: '15000'
                    - arch: x64
                      runner: macos-15-intel
                      bmpAssuranceFirstBuildBudgetMs: '30000'
        runs-on: ${{ matrix.runner }}
        env:
            NODE_VERSION: '16.20.2'
            BMP_ASSURANCE_FIRST_BUILD_BUDGET_MS: ${{ matrix.bmpAssuranceFirstBuildBudgetMs }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Verify Node.js version
              run: node -e "if (process.version !== 'v' + process.env.NODE_VERSION) { throw new Error('Expected Node.js v' + process.env.NODE_VERSION + ', got ' + process.version); }"

            - name: Setup Python for native modules
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: npm ci

            - name: Run macOS lint
              run: npm run lint

            - name: Run macOS tests
              run: npm test

            - name: Run macOS minified CI tests
              run: npm run test:ci:minified

            - name: Build on macOS
              run: npm run build

            - name: Run macOS packaged UI tests
              run: npm run test:e2e

            - name: Verify packaged BMP SQLite
              run: npm run test:packaged:sqlite
              env:
                  PACKAGED_SQLITE_EXPECTED_ARCH: ${{ matrix.arch }}

            - name: Upload Playwright report
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-macos-${{ matrix.arch }}
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    e2e-windows:
        name: Windows Tests and Packaged E2E
        runs-on: windows-2022
        env:
            NODE_VERSION: '16.20.2'

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Verify Node.js version
              run: node -e "if (process.version !== 'v' + process.env.NODE_VERSION) { throw new Error('Expected Node.js v' + process.env.NODE_VERSION + ', got ' + process.version); }"

            - name: Setup Python for native modules
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: npm ci

            - name: Run Windows lint
              run: npm run lint

            - name: Run Windows tests
              run: npm test

            - name: Run Windows minified CI tests
              run: npm run test:ci:minified

            - name: Build on Windows
              run: npm run build

            - name: Run Windows packaged UI tests
              run: npm run test:e2e

            - name: Verify packaged BMP SQLite
              run: npm run test:packaged:sqlite
              env:
                  PACKAGED_SQLITE_EXPECTED_ARCH: x64

            - name: Upload Playwright report
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-windows
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7
