name: Test

on:
    pull_request:
    push:
        branches:
            - main
            - master

jobs:
    frr-bmp-e2e:
        name: FRR BMP/BGP Interoperability E2E
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        env:
            NODE_VERSION: '16.20.2'
            FRR_BMP_ROUTES_PER_FAMILY: '1024'

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Setup Python for native modules
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: npm ci

            - name: Verify Docker
              run: docker info

            - name: Run FRR BMP interoperability E2E
              run: npm run test:e2e:frr

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Run BGP/FRR route and page parity E2E
              run: npm run test:e2e:bgp-frr

    e2e-macos:
        name: macOS arm64 Tests and Packaged E2E
        runs-on: macos-15
        env:
            NODE_VERSION: '16.20.2'
            BMP_ASSURANCE_FIRST_BUILD_BUDGET_MS: '15000'

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Verify Node.js version
              run: node -e "if (process.version !== 'v' + process.env.NODE_VERSION) { throw new Error('Expected Node.js v' + process.env.NODE_VERSION + ', got ' + process.version); }"

            - name: Setup Python for native modules
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: npm ci

            - name: Run macOS lint
              run: npm run lint

            - name: Run macOS tests
              run: npm test

            - name: Run macOS minified CI tests
              run: npm run test:ci:minified

            - name: Install libyang build dependencies
              run: brew install cmake

            - name: Build bundled libyang runtime
              run: npm run libyang:build:unix

            - name: Test bundled libyang runtime
              run: npm run libyang:smoke

            - name: Build on macOS
              run: npm run build

            - name: Run macOS packaged UI tests
              run: npm run test:e2e

            - name: Verify packaged BMP SQLite
              run: npm run test:packaged:sqlite
              env:
                  PACKAGED_SQLITE_EXPECTED_ARCH: arm64

            - name: Upload Playwright report
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-macos-arm64
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    e2e-windows:
        name: Windows Tests and Packaged E2E
        runs-on: windows-2022
        env:
            NODE_VERSION: '16.20.2'

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Verify Node.js version
              run: node -e "if (process.version !== 'v' + process.env.NODE_VERSION) { throw new Error('Expected Node.js v' + process.env.NODE_VERSION + ', got ' + process.version); }"

            - name: Setup Python for native modules
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: npm ci

            - name: Run Windows lint
              run: npm run lint

            - name: Run Windows tests
              run: npm test

            - name: Run Windows minified CI tests
              run: npm run test:ci:minified

            - name: Build bundled libyang runtime
              run: npm run libyang:build:windows

            - name: Test bundled libyang runtime
              run: npm run libyang:smoke

            - name: Build on Windows
              run: npm run build

            - name: Run Windows packaged UI tests
              run: npm run test:e2e

            - name: Verify packaged BMP SQLite
              run: npm run test:packaged:sqlite
              env:
                  PACKAGED_SQLITE_EXPECTED_ARCH: x64

            - name: Upload Playwright report
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-windows
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7
